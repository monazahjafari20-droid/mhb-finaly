name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-30" "build-tools;30.0.3" "platform-tools" > /dev/null 2>&1 || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Copy SDK to Buildozer (Crucial)
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk
          cp -r $ANDROID_HOME/build-tools /home/runner/.buildozer/android/platform/android-sdk/
          cp -r $ANDROID_HOME/platforms /home/runner/.buildozer/android/platform/android-sdk/
          cp -r $ANDROID_HOME/platform-tools /home/runner/.buildozer/android/platform/android-sdk/
          cp -r $ANDROID_HOME/licenses /home/runner/.buildozer/android/platform/android-sdk/

      - name: Build APK
        run: |
          cd ${{ github.workspace }}
          export ANDROIDSDK=/home/runner/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=$ANDROIDSDK
          export ANDROIDNDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -n 1)
          
          echo "SDK: $ANDROIDSDK"
          echo "NDK: $ANDROIDNDK"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
